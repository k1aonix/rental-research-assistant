async function docxText(base64){

 let end=-1;for(let i=bytes.length-22;i>=Math.max(0,bytes.length-65557);i--)if(view.getUint32(i,true)===0x06054b50){end=i;break;}
 if(end<0)fail('DOCX 文件损坏');let pos=view.getUint32(end+16,true);
 for(let n=0;n<view.getUint16(end+10,true);n++){
  if(view.getUint32(pos,true)!==0x02014b50)fail('DOCX 目录损坏');
  const size=view.getUint32(pos+20,true),unpacked=view.getUint32(pos+24,true),len=view.getUint16(pos+28,true),extra=view.getUint16(pos+30,true),comment=view.getUint16(pos+32,true),offset=view.getUint32(pos+42,true),method=view.getUint16(pos+10,true);
  const name=new TextDecoder().decode(bytes.slice(pos+46,pos+46+len));pos+=46+len+extra+comment;
  if(name!=='word/document.xml')continue;if(unpacked>2000000)fail('合同正文过长');
  const start=offset+30+view.getUint16(offset+26,true)+view.getUint16(offset+28,true);let content=bytes.slice(start,start+size);
  if(method===8)content=new Uint8Array(await new Response(new Blob([content]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());else if(method!==0)fail('暂不支持此 DOCX 压缩格式');
  if(content.length>2000000)fail('合同正文过长');const xml=new DOMParser().parseFromString(new TextDecoder().decode(content),'text/xml');
  return [...xml.getElementsByTagNameNS('*','p')].map(p=>[...p.getElementsByTagNameNS('*','t')].map(t=>t.textContent).join('')).join('\n');
 }fail('DOCX 缺少正文');
}

  if(ext==='docx'){text+=await docxText(input.content_base64);}

const originalText=new WeakMap();let localizationBusy=false;
function languageControl(){return `<div class="language-choice" role="group" aria-label="界面语言 / Interface language"><button type="button" data-language="zh" aria-pressed="${demoLanguage==='zh'}">中文</button><button type="button" data-language="en" aria-pressed="${demoLanguage==='en'}">English</button></div>`;}
function translateInterface(raw,entries){
  if(demoLanguage!=='en')return raw;
  const trim=raw.trim();
  if(UI_TRANSLATIONS[trim])return raw.replace(trim,UI_TRANSLATIONS[trim]);
  const history=trim.match(/^共 (\d+) 次成功检查 · 默认最近 10 条，旧记录始终保留$/);
  if(history)return `${history[1]} completed reviews · Latest 10 shown by default; older records are retained`;
  const pages=trim.match(/^PDF · (\d+)页$/);if(pages)return `PDF · ${pages[1]} pages`;
  const alt=trim.match(/^合同第(\d+)页$/);if(alt)return `Contract page ${alt[1]}`;
  let result=raw;
  if(raw.length<300)for(const [zh,en] of entries)if(zh.length>=3)result=result.split(zh).join(en);
  return result;
}
function localizeDemo(){
  if(localizationBusy)return;localizationBusy=true;
  try{
    document.documentElement.lang=demoLanguage==='zh'?'zh-CN':'en';
    const entries=Object.entries(UI_TRANSLATIONS).sort((a,b)=>b[0].length-a[0].length);
    function apply(node){let raw=originalText.get(node);if(raw===undefined){raw=node.nodeValue;originalText.set(node,raw);}else if(node.nodeValue!==raw&&node.nodeValue!==node.__lastLocalized){raw=node.nodeValue;originalText.set(node,raw);}const result=translateInterface(raw,entries);if(node.nodeValue!==result)node.nodeValue=result;node.__lastLocalized=result;}
    const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let node;
    while(node=walker.nextNode()){
      const parent=node.parentElement;
      if(!parent||parent.closest('script,style,input,textarea,.original-copy,.source-text,.author-evidence,.evidence,.logs,.history-log,.conclusion p,.report-hero p,.check-copy p,[data-language]'))continue;
      if(parent.closest('.source')&&!parent.closest('.ui-copy'))continue;
      apply(node);
    }
    document.querySelectorAll('[placeholder],[aria-label],[title],[alt]').forEach(element=>{
      if(element.closest('.original-copy,.source,.source-text,.author-evidence,.evidence,[data-language]')||element.classList.contains('language-choice'))return;
      for(const name of ['placeholder','aria-label','title','alt']){const attr=element.getAttributeNode(name);if(attr)apply(attr);}
    });
    document.querySelectorAll('[data-language]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.language===demoLanguage)));
  }finally{localizationBusy=false;}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-language]');if(!b)return;demoLanguage=b.dataset.language;try{localStorage.setItem('rent-singlehtml-language',demoLanguage)}catch{}localizeDemo();});
new MutationObserver(()=>localizeDemo()).observe(document.body,{childList:true,subtree:true,characterData:true});

async function rpc(path, method='GET', payload=null) {
  window.rentalAnalytics?.request(path,method,payload);
  const headers = {'Accept':'application/json'};
  let command;
  if(method!=='GET') {
    headers['Content-Type']='application/json';headers['X-CSRF-Token']=state.workspace?.csrf_token || '';
    command=method+path+JSON.stringify(payload || {});
    if(!pendingKeys.has(command))pendingKeys.set(command,crypto.randomUUID());
    headers['Idempotency-Key']=pendingKeys.get(command);
  }
  let response;
  try {response=await fetch('/api/v1'+path,{method,headers,credentials:'same-origin',body:method==='GET'?undefined:JSON.stringify(payload || {})});}
  catch(error){window.rentalAnalytics?.failure(path,method,'network');throw new Error('网络连接中断，输入已保留；再次保存会使用同一请求编号。');}
  const data=await response.json();
  if(response.ok)window.rentalAnalytics?.response(path,method,data.data);
  else window.rentalAnalytics?.failure(path,method,data.error?.code);
  if(command)pendingKeys.delete(command);
  if(!response.ok){const fieldMessage=data.error?.details?.fields?.[0]?.message;const error=new Error((data.error?.message || '操作未完成')+(fieldMessage?' '+fieldMessage:''));error.code=data.error?.code;error.details=data.error?.details;throw error;}
  return data.data;
}

    try{if(state.profileDirty)await saveProfile();for(const key of [...state.drafts.keys()])await saveRecordGroup(key);if(state.viewingDirty)await saveViewing();}

function collectProfile(){
  const form=$('#profile-form');if(!form)return state.profileDraft;
  const d=state.profileDraft;
  d.min_rent_cent=form.min_rent.value===''?'':numeric(form.min_rent.value,100);
  d.max_rent_cent=form.max_rent.value===''?'':numeric(form.max_rent.value,100);
  d.max_commute_min=form.max_commute_min.value===''?'':Number(form.max_commute_min.value);
  d.max_walk_min=form.max_walk_min.value===''?'':Number(form.max_walk_min.value);
  form.querySelectorAll('[data-pref-text]').forEach(el=>d.preferences[Number(el.dataset.prefText)].original_text=el.value);
  form.querySelectorAll('[data-pref-level]').forEach(el=>d.preferences[Number(el.dataset.prefLevel)].requirement=el.value);
  return d;
}

async function saveProfile(){
  const draft=collectProfile();if(state.targetSelectionDirty)throw new Error('目的地已修改，请重新查询并选择具体地址。');if((draft.min_rent_cent!==''&&draft.min_rent_cent%100)||(draft.max_rent_cent!==''&&draft.max_rent_cent%100))throw new Error('预算请填写整数元。');
  if(!$('#profile-form')?.reportValidity())throw new Error('请完整填写画像');
  if(!profile().target_confirmed_at)throw new Error('请先查询并选择具体地址');
  const yes=await choose('锁定租房画像','后续所有房源按这套需求调查；修改需要更换画像并清空业务数据。',[{text:'取消',value:'cancel'},{text:'确认保存',value:'save',style:'primary'}]);

}

async function startTask(path,payload){const seq=++state.taskSeq;let data;try{data=await rpc(path,'POST',payload);}catch(error){if(error.code==='RECORD_BUSY'&&error.details?.task_id){await selectTask(error.details.task_id);toast('已有当前任务，已为你切换。');return;}throw error;}if(seq!==state.taskSeq)return;if(data.mode==='auto')state.completionWatch.add(data.task_id);if(data.disposition==='existing'){state.selected=data.record.record_id;state.page='candidates';await loadRecords();toast('已复用原有调查结果');}else{acceptTask(data,seq);state.page='input';await reloadWorkspace();}render();}

 const preferenceHtml=prefs.map((p,i)=>{const result=(c.preferences||[]).find(x=>x.preference_id===p.preference_id)||{result:'unknown',reason:'现有资料无法确认，未发现明确违反证据。'};const themes=(sections.preference||[]).filter(t=>t.preference_id===p.preference_id);return `<div class="report-assessment"><h4>偏好${i+1}：${esc(p.kind==='agent'?'拒绝中介及二房东':p.original_text)} <span class="report-status" data-result="${result.result}">${{pass:'有证据支持',fail:'不符合',unknown:'无法确认'}[result.result]||'无法确认'}</span></h4>${themes.length?themes.map(narrative).join(''):`<p class="report-reason">${esc(result.reason)}${cite(result.evidence_ids)}</p>`}</div>`;}).join('');

 const upload=state.moduleDrafts[key]?.upload;if(!fileId)fileId=upload?.file_id;if(!fileId)return;
 const doc=await rpc(assistantPath(key)+'/files/'+fileId);const suffix=doc.file_name.split('.').pop().toLowerCase();
 const type={pdf:'application/pdf',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',zip:'application/zip'}[suffix];
 const bytes=Uint8Array.from(atob(doc.content_base64),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type}));
 modal(`<div class="document-toolbar"><strong>${esc(doc.file_name)}</strong><a id="assistant-download" download="${esc(doc.file_name)}">下载原文</a>${button('−','module-zoom','data-zoom="out"','small')}<span id="document-zoom-label">100%</span>${button('＋','module-zoom','data-zoom="in"','small')}${button('关闭','close')}</div><div class="document-canvas">${doc.pages.map(p=>p.image?`<img class="document-page" src="${p.image}" alt="第${p.page}页">`:`<section><h3>位置 ${p.page}</h3><pre class="document-text">${esc(p.text)}</pre></section>`).join('')}</div>`);
 $('#assistant-download').href=url;$('#dialog').addEventListener('close',()=>URL.revokeObjectURL(url),{once:true});
}


function renderTaskRecordResults(task){const names={technical_failure:'技术中断',skipped:'用户跳过',screened:'条件不符',completed:'已进入候选',needs_location:'待补地址'};return task.record_results?.length?`<section class="task-post-results gap"><h3>逐帖调查结果（本任务）</h3><p class="small muted">上方阶段仅对应标出的当前／最近房源。以下逐帖列出已处理结果；读取来源失败不等于已调用作者模型。</p>${task.record_results.map(item=>`<details class="task-post-result"><summary>${item.round?'第'+item.round+'轮':'单帖调查'} · ${esc(item.title||item.note_id)} · ${esc(names[item.outcome]||item.outcome)}</summary><p class="mono">Note ID：${esc(item.note_id)}</p><p><strong>停止阶段：</strong>${esc(stages[item.stopped_step]||item.stopped_step||'已完成')}${item.failure_phase==='source_read'?'（来源资料读取，未调用该阶段模型）':''}</p><p class="original-copy">${esc(item.reason)}</p>${item.reason_code?`<p class="small mono">${esc(item.reason_code)}</p>`:''}<p class="small">已保存：${item.completed_steps.map(s=>esc(stages[s]||s)).join('、')||'无'}</p>${renderTaskStages({current_listing:item,stage_progress:item.stage_progress})}${item.recovery?`<div class="note">该帖后续已完成续接并生成完整报告；以上为本任务原停止记录。${button("查看续接完整报告","report",`data-id="${item.recovery.full_report_id}"`)}</div>`:`<p class="small muted">${esc(item.resume_hint)}</p>`}</details>`).join('')}</section>`:'';}


function renderSearchCoverage(p){if(!p)return '<p class="small muted" role="status">正在检查人工站点表和冻结搜索快照；此检查不调用模型或模拟地图。</p>';const c=p.coverage;return `<div class="note ${!p.can_start?'error':c?.state==='partial'?'warn':''} search-coverage"><strong>启动前范围检查</strong><p class="small">具体房源规划：${esc(p.planning_context?.reference_date||'待配置')} 08:30 北京时间。人工站点参考：${esc(p.table_time_basis||'未配置')}。人工表只筛选站点，不替代具体小区当天通勤核验。</p>${p.table_coverage_limited?'<p>人工表仅覆盖参考耗时60分钟以内站点；你的通勤上限保持原值，未覆盖表外站点。</p>':''}${c?`<p>入选${c.selected_count??c.bindings.length}站；可用${c.covered_count}站；缺少可用快照${c.missing_station_ids.length}站；失败或不完整快照${c.snapshot_issues.length}条。</p><p class="small">可用站点：${esc(c.bindings.filter(b=>b.state==='covered').map(b=>b.station_name||b.canonical_station_id).join('、')||'无')}。${c.state==='partial'?'只能处理上述可用站点，不能声称覆盖全部入选范围。':''}</p><details><summary>展开缺失站点和异常快照</summary><p class="source-text">${esc(c.bindings.filter(b=>b.state!=='covered').map(b=>b.station_name||b.canonical_station_id).join('、')||'没有缺失站点')}</p>${c.snapshot_issues.map(x=>`<p class="small">${esc(x.station_name||x.station_id)} · ${esc(x.keyword||x.search_id||'')} · ${esc(x.state==='binding_revision_mismatch'?'新旧快照内容不一致，未继承绑定':x.quality==='failed'?'搜索失败':'原始位置不完整或未确认')} · 原返回${esc(x.returned_count??'未记录')}条／保存${esc(x.saved_position_count??'未确认')}个位置</p>`).join('')}</details>`:''}${c?.completeness_limits?.length?'<p class="small">旧快照仅确认保存位置连续，原返回总数未记录，不保证原始结果全量覆盖。</p>':''}${p.error?`<p>${esc(p.error.message)}</p>`:''}${!p.can_start?'<p>暂不创建搜索任务；请先完善来源后重新检查，不会将缺失算作零结果。</p>':''}</div>`;}
function ensureSearchPreflight(){if(window.rentalLayoutPreview)return;const key=profile()?.profile_id+':'+profile()?.version;if(state.preflightKey===key)return;state.preflightKey=key;state.searchPreflight=null;rpc('/search-preflight').then(p=>{if(state.preflightKey!==key)return;state.searchPreflight=p;if(state.page==='input')render();}).catch(e=>{if(state.preflightKey!==key)return;state.searchPreflight={can_start:false,error:{message:e.message}};if(state.page==='input')render();});}
function confirmSearchCoverage(p){return new Promise(resolve=>{dialogResolve=value=>resolve(value==='continue');modal(`<h2>确认仅处理当前可用范围</h2>${renderSearchCoverage(p)}<p>缺失范围会保留在任务结果中，不计作正常零结果。</p><div class="actions end">${button('暂不开始','choice','data-value="cancel"')}${button('仅处理可用范围并继续','choice','data-value="continue"','primary')}</div>`);});}
async function startSearch(){if(state.searchStarting)return;state.searchStarting=true;const expected=profile()?.profile_id+':'+profile()?.version;try{const p=await rpc('/search-preflight');if(expected!==profile()?.profile_id+':'+profile()?.version)return;state.searchPreflight=p;render();if(!p.can_start){toast(p.error?.message||'请先完善来源');return;}if(p.requires_partial_confirmation&&!await confirmSearchCoverage(p))return;if(expected!==profile()?.profile_id+':'+profile()?.version)return;await startTask('/tasks/search',{...command(),preflight_token:p.preflight_token,allow_partial:p.requires_partial_confirmation});}finally{state.searchStarting=false;}}

function renderCompleteness(data,compact=false){if(!data)return '';const detail=`${data.available?.length?`<p>已取得：${esc([...new Set(data.available)].join('；'))}。</p>`:''}${(data.limited||[]).map(x=>`<p>${esc(x.name)}资料不足：${esc(x.impact)}</p>`).join('')}${data.optional?.length?`<p>${esc([...new Set(data.optional)].join(' '))}</p>`:''}${(data.notes||[]).map(x=>`<p>仍待核实：${esc(x)}</p>`).join('')}<p>${esc(data.note||'资料取得不等于已证实符合。')}</p>`;return compact?`<details class="data-completeness"><summary>资料说明</summary>${detail}</details>`:`<section class="data-completeness"><h3>资料说明</h3>${detail}</section>`;}

function closeSearchCompletion(){const d=$('#search-complete-dialog');if(d?.open)d.close();}
function syncSearchCompletion(){if(window.rentalLayoutPreview)return;const t=state.task;let d=$('#search-complete-dialog');if(d?.open&&(d.dataset.task!==t?.task_id||d.dataset.profile!==profile()?.profile_id))d.close();if(!t||t.mode!=='auto'||t.state!=='completed'||!state.completionWatch.has(t.task_id))return;const key='rental.search-result-seen:'+t.profile_id+':'+t.task_id;let seen=state.completionSeen.has(key);try{seen=seen||localStorage.getItem(key)==='1';}catch{}if(seen||d?.open||$('#dialog')?.open||$('#location-dialog')?.open||$('#report-dialog')?.open||state.profileDirty||state.drafts.size||state.viewingDirty||moduleDirty.size)return;if(!d){d=document.createElement('dialog');d.id='search-complete-dialog';document.body.append(d);}const counts=t.result?.summary||{};d.dataset.task=t.task_id;d.dataset.profile=t.profile_id;d.innerHTML=`<h2>本次搜索已结束</h2><p class="small muted">任务 ${esc(t.task_id.slice(-6))} · ${esc(new Date(t.updated_at).toLocaleString('zh-CN',{hour12:false}))}</p><div class="grid g2 completion-counts">${[['candidate_added','进入候选'],['screened','条件筛除'],['skipped','用户跳过'],['technical_failure','技术中断']].map(([key,label])=>`<p data-outcome="${key}">${label}：<strong>${Number(counts[key]||0)}</strong> 套</p>`).join('')}</div><p>搜索结束不代表全部房源调查成功；请结合各帖原因和报告继续核实。</p>${t.station_selection?.snapshot_coverage?.state==='partial'?'<p class="small muted">本次仅处理已有可用快照，未覆盖所有入选站点。</p>':''}<div class="actions end">${button('留在当前页','completion-stay')}${button('查看候选房源','completion-candidates','','primary')}</div>`;try{d.showModal();state.completionSeen.add(key);try{localStorage.setItem(key,'1');}catch{}}catch{}}
})();


</script></body></html>
